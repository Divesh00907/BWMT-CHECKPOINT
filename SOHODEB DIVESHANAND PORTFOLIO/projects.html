<main>

    <!-- ROCK PAPER SCISSORS -->
    <section class="rps-section">
    <h2>Rock Paper Scissors</h2>

    <div class="scores">
        <p>Player: <span id="playerScore">0</span></p>
        <p>Computer: <span id="computerScore">0</span></p>
    </div>

    <div class="rps-buttons">
        <button class="choice-btn">🪨 Rock</button>
        <button class="choice-btn">📄 Paper</button>
        <button class="choice-btn">✂️ Scissors</button>
    </div>

    <button id="resetBtn">Reset Score</button>

    <p id="result">Make your choice!</p>
</section>

    <!-- FLATLAND -->
    <section>
        <h2>Flatland Animation</h2>

        <div id="square"></div>
        <p id="words">Hover over the square!</p>
    </section>
